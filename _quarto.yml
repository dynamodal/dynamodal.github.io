project:
  type: website

  render:
    - "*.qmd"

  resources:
    - "files/**"
    - "schedule/**"

freeze: auto

website:
  title: "Dynamodal"
  description: "Thomas Wells is an independent data and AI consultant who helps consulting teams and the organizations they serve with analytics, data strategy, and putting AI tools to work."
  favicon: "files/favicon.png"
  site-url: "https://www.dynamodal.com"
  repo-url: "https://github.com/dynamodal/dynamodal.github.io"
  search: false
  open-graph:
    image: files/social-card.png
    image-width: 1200
    image-height: 630
  twitter-card:
    image: files/social-card.png
    card-style: summary_large_image
  navbar:
    pinned: true
    logo: "files/logo-mark.svg"
    logo-alt: "Dynamodal logo"
    right:
      - href: services.qmd
        text: "Services"
      - href: about.qmd
        text: "About"
      - href: contact.qmd
        text: "Contact"
      - href: https://www.dynamodal.com/schedule/
        text: "Book a call"

  page-footer:
    left: |
      <span class="faux-block">© 2026 Dynamodal, LLC · Fruita, Colorado</span>
      <span class="faux-block footer-aside">Need tech help around Fruita? Try [Fruita Tech Wizard](https://fruitatechwizard.com).</span>
    right: |
      <span class="faux-block">Built with [R](https://www.r-project.org/) and [Quarto](https://quarto.org/)</span>
      <span class="faux-block">[<i class="bi bi-github" aria-hidden="true"></i> View source](https://github.com/dynamodal/dynamodal.github.io)</span>

format:
  html:
    theme:
      - default
      - html/styles.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: false
